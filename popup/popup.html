<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Session Handoff</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Session Handoff</h1>
      <span class="badge">local only</span>
    </header>

    <section class="capture-row">
      <button id="captureBtn" class="primary">Capture current tab</button>
      <span id="captureStatus" class="status"></span>
    </section>

    <section id="selectionRow" class="selection-row hidden">
      <p>You right-clicked and sent a text selection here. Use it instead?</p>
      <div class="row">
        <button id="useSelectionBtn">Use selection</button>
        <button id="dismissSelectionBtn" class="ghost">Dismiss</button>
      </div>
    </section>

    <details class="paste-fallback">
      <summary>Paste conversation manually instead</summary>
      <textarea id="pasteInput" rows="4" placeholder="Paste raw conversation text here (separate turns with a blank line)..."></textarea>
      <button id="generateFromPasteBtn">Generate from pasted text</button>
    </details>

    <section class="output-row">
      <label for="output">Handoff prompt (editable)</label>
      <textarea id="output" rows="14" placeholder="Your generated handoff prompt will appear here..."></textarea>
      <div class="row">
        <button id="copyBtn">Copy to clipboard</button>
        <input id="titleInput" type="text" placeholder="Snapshot title (optional)" />
        <button id="saveBtn">Save snapshot</button>
      </div>
    </section>

    <section class="history-row">
      <h2>Saved snapshots</h2>
      <ul id="historyList"></ul>
    </section>
  </div>

  <script src="../lib/storage.js"></script>
  <script src="../lib/templater.js"></script>
  <script src="popup.js"></script>
</body>
</html>
