<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Session Handoff Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; color: #1f2937; }
    h2 { color: #4f46e5; }
    .card { background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    input[type="password"] { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; margin-bottom: 16px; }
    .hint { font-size: 12px; color: #6b7280; margin-top: -12px; margin-bottom: 16px; display: block; }
    button { background: #4f46e5; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #4338ca; }
    #status { margin-top: 12px; font-size: 14px; color: #10b981; display: none; }
  </style>
</head>
<body>
  <h2>Session Handoff Settings (v2)</h2>
  <div class="card">
    <label for="apiKey">Groq API Key (Optional for Smart Summaries)</label>
    <input type="password" id="apiKey" placeholder="gsk_...">
    <span class="hint">Your key is stored securely in your browser's local storage and is never sent anywhere except directly to Groq's API.</span>
    
    <button id="saveBtn">Save Settings</button>
    <div id="status">Settings saved successfully!</div>
  </div>
  <script src="options.js"></script>
</body>
</html>
